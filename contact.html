<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:450px;
            padding:35px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,0.3);
        }

        h1{
            color:#203a43;
            margin-bottom:25px;
        }

        p{
            font-size:18px;
            margin:15px 0;
            color:#333;
        }

        .back-btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 30px;
            background:#203a43;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
        }

        .back-btn:hover{
            background:#00bfff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Contact Details</h1>

        <p><strong>Name:</strong> Jhansi Kagitha</p>
        <p><strong>Email:</strong> yourmail@example.com</p>
        <p><strong>Phone:</strong> +91 XXXXXXXXXX</p>
        <p><strong>Location:</strong> Andhra Pradesh, India</p>

        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

</body>
</html>
